[package]
name = "skilly-windows-shell-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Skilly Windows host app (Tauri 2). See docs/architecture/phase-7-windows-shell-prd.md."

[[bin]]
name = "skilly-windows-shell-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
url = "2"
skilly-core-domain = { path = "../../core/domain" }
skilly-core-policy = { path = "../../core/policy" }
skilly-core-realtime = { path = "../../core/realtime" }
skilly-core-skills = { path = "../../core/skills" }
skilly-windows-shell = { path = "../windows-shell" }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
