<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skilly</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        --window: #111217;
        --surface: #17191f;
        --surface-hover: #1d2027;
        --surface-strong: #22252d;
        --line: rgba(255, 255, 255, 0.09);
        --line-strong: rgba(255, 255, 255, 0.15);
        --text: #f5f4f1;
        --text-secondary: #b8b7b2;
        --text-tertiary: #84837f;
        --accent: #f3a62f;
        --accent-soft: rgba(243, 166, 47, 0.13);
        --accent-text: #ffc96f;
        --danger: #ff8b98;
        --success: #69c89c;
        --radius-panel: 18px;
        --radius-control: 10px;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--window);
        color: var(--text);
      }

      body { font-size: 13px; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .app {
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--window);
      }

      .app-header {
        min-height: 54px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px 9px 14px;
        border-bottom: 1px solid var(--line);
        user-select: none;
      }

      .brand {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .brand-mark {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        object-fit: contain;
        filter: drop-shadow(0 0 7px rgba(252, 211, 77, 0.28));
      }

      .brand-copy { min-width: 0; }
      .brand-title { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
      .brand-subtitle {
        margin-top: 1px;
        color: var(--text-tertiary);
        font-size: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .header-spacer { flex: 1; }
      .header-actions { display: flex; align-items: center; gap: 2px; }

      .icon-button,
      .back-button {
        border: 0;
        background: transparent;
        color: var(--text-tertiary);
      }

      .icon-button {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        font-size: 15px;
      }

      .icon-button:hover,
      .icon-button[aria-pressed="true"],
      .back-button:hover { background: var(--surface-hover); color: var(--text); }
      .icon-button:active, .back-button:active, .button:active { transform: translateY(1px); }

      .content {
        flex: 1;
        min-height: 0;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--line-strong) transparent;
      }

      .view { min-height: 100%; }
      .view[hidden] { display: none !important; }
      .home-view { padding: 14px; }
      .secondary-view { padding: 0 14px 16px; }

      .view-header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 49px;
        margin: 0 -14px 12px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(17, 18, 23, 0.96);
        backdrop-filter: blur(14px);
      }

      .view-header h1 { margin: 0; font-size: 14px; font-weight: 650; }
      .view-header p { margin: 2px 0 0; color: var(--text-tertiary); font-size: 10px; }
      .back-button { width: 28px; height: 28px; border-radius: 8px; font-size: 18px; }

      .stack { display: grid; gap: 12px; }
      .section { display: grid; gap: 10px; }
      .section + .section { padding-top: 14px; border-top: 1px solid var(--line); }
      .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .section-heading h2 { margin: 0; font-size: 11px; font-weight: 650; color: var(--text-secondary); }
      .section-heading span { color: var(--text-tertiary); font-size: 10px; }

      .setup-banner,
      .turn-card,
      .active-skill,
      .history-card,
      .settings-group,
      .empty-state,
      .notice {
        border: 1px solid var(--line);
        border-radius: var(--radius-panel);
        background: var(--surface);
      }

      .setup-banner,
      .turn-card,
      .active-skill,
      .history-card,
      .settings-group,
      .notice { padding: 13px; }

      .setup-banner { border-color: rgba(243, 166, 47, 0.22); background: var(--accent-soft); }
      .notice[data-tone="blocked"] { border-color: rgba(255, 139, 152, 0.25); }

      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .row-start { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .copy { min-width: 0; }
      .copy h2, .copy h3, .copy p { margin: 0; }
      .copy h2 { font-size: 14px; line-height: 1.3; }
      .copy h3 { font-size: 12px; line-height: 1.35; }
      .copy p { margin-top: 4px; color: var(--text-secondary); font-size: 11px; line-height: 1.45; }

      .active-skill { background: linear-gradient(145deg, rgba(243, 166, 47, 0.12), var(--surface) 50%); }
      .active-label { color: var(--accent-text); font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .skill-name { margin: 5px 0 0; font-size: 17px; font-weight: 680; letter-spacing: -0.02em; }
      .skill-summary { margin: 4px 0 0; color: var(--text-secondary); font-size: 11px; line-height: 1.4; }

      .status {
        flex: 0 0 auto;
        padding: 4px 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--text-secondary);
        background: rgba(255, 255, 255, 0.035);
        font-size: 9px;
        font-weight: 650;
      }
      .status[data-tone="ready"], .status[data-tone="speaking"] { color: #a8e1c4; border-color: rgba(105, 200, 156, 0.25); }
      .status[data-tone="listening"], .status[data-tone="responding"], .status[data-tone="transcribing"] { color: var(--accent-text); border-color: rgba(243, 166, 47, 0.28); }
      .status[data-tone="attention"] { color: var(--accent-text); border-color: rgba(243, 166, 47, 0.28); }
      .status[data-tone="error"], .status[data-tone="blocked"] { color: #ffc0c7; border-color: rgba(255, 139, 152, 0.25); }

      .turn-state { display: flex; align-items: center; gap: 10px; }
      .turn-orb {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border-radius: 50%;
        color: var(--accent-text);
        background: var(--accent-soft);
        font-size: 14px;
      }

      .conversation-preview { display: grid; gap: 7px; margin-top: 11px; }
      .message { padding: 9px 10px; border-radius: var(--radius-control); background: var(--surface-strong); }
      .message strong { display: block; margin-bottom: 3px; color: var(--text-tertiary); font-size: 9px; }
      .message p { margin: 0; color: var(--text-secondary); font-size: 11px; line-height: 1.45; }
      .message.assistant { background: var(--accent-soft); }
      .message.assistant strong { color: var(--accent-text); }

      .skill-list { display: grid; }
      .skill-row { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 8px 2px; }
      .skill-row + .skill-row { border-top: 1px solid var(--line); }
      .skill-icon { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 8px; background: var(--surface-strong); color: var(--accent-text); font-weight: 700; }
      .skill-row-copy { flex: 1; min-width: 0; }
      .skill-row-copy strong, .skill-row-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .skill-row-copy strong { font-size: 11px; }
      .skill-row-copy span { margin-top: 2px; color: var(--text-tertiary); font-size: 9px; }

      .button,
      .text-button {
        border: 0;
        border-radius: var(--radius-control);
        white-space: nowrap;
      }
      .button { min-height: 32px; padding: 7px 11px; background: var(--surface-strong); color: var(--text); font-size: 10px; font-weight: 650; }
      .button:hover { background: #2a2e38; }
      .button.primary { background: var(--accent); color: #241704; }
      .button.primary:hover { background: #ffb84d; }
      .button.danger { color: #ffc0c7; }
      .text-button { padding: 5px 4px; color: var(--text-tertiary); background: transparent; font-size: 10px; }
      .text-button:hover { color: var(--text); }
      .button-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }

      details { border-top: 1px solid var(--line); padding-top: 12px; }
      summary { color: var(--text-secondary); cursor: pointer; font-size: 11px; }
      .import-form { display: grid; gap: 8px; margin-top: 9px; }
      .field {
        width: 100%;
        min-height: 34px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-control);
        padding: 7px 9px;
        background: #101116;
        color: var(--text);
        font-size: 11px;
      }
      .field::placeholder { color: var(--text-tertiary); }
      select.field { cursor: pointer; }

      .history-list { display: grid; gap: 10px; }
      .history-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--text-tertiary); font-size: 9px; }
      .history-card .message:first-of-type { margin-top: 10px; }
      .history-card .message + .message { margin-top: 7px; }

      .settings-list { display: grid; gap: 12px; }
      .settings-group { display: grid; gap: 0; padding: 0 13px; }
      .settings-title { padding: 12px 0 8px; color: var(--text-tertiary); font-size: 9px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
      .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 51px; padding: 9px 0; }
      .setting-row + .setting-row { border-top: 1px solid var(--line); }
      .setting-copy { flex: 1; min-width: 0; }
      .setting-copy strong, .setting-copy span { display: block; }
      .setting-copy strong { font-size: 11px; }
      .setting-copy span { margin-top: 3px; color: var(--text-tertiary); font-size: 9px; line-height: 1.35; }
      .setting-row .field { width: 122px; }

      .toggle { position: relative; width: 38px; height: 22px; flex: 0 0 auto; border: 1px solid var(--line-strong); border-radius: 999px; background: #292c34; }
      .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transition: transform 150ms ease; }
      .toggle[data-on="true"] { background: var(--accent); border-color: var(--accent); }
      .toggle[data-on="true"]::after { transform: translateX(16px); background: #241704; }

      .empty-state { display: grid; place-items: center; min-height: 240px; padding: 28px; text-align: center; }
      .empty-icon { width: 42px; height: 42px; display: grid; place-items: center; margin: 0 auto 12px; border-radius: 13px; background: var(--surface-strong); color: var(--text-tertiary); font-size: 19px; }
      .empty-state h2 { margin: 0; font-size: 13px; }
      .empty-state p { max-width: 230px; margin: 6px 0 0; color: var(--text-tertiary); font-size: 10px; line-height: 1.5; }

      .ptt-strip { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 7px 12px; border-top: 1px solid var(--line); color: var(--text-tertiary); font-size: 10px; }
      .key { min-width: 22px; height: 21px; display: inline-grid; place-items: center; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--text-secondary); font-size: 9px; font-weight: 650; box-shadow: inset 0 -1px rgba(255,255,255,0.04); }
      .ptt-strip .status { margin-left: auto; }

      .app-footer { min-height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 14px 8px; border-top: 1px solid var(--line); }
      .footer-actions { display: flex; align-items: center; gap: 10px; }
      .footer-status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-tertiary); font-size: 9px; }

      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

      @media (prefers-contrast: more) {
        :root { --line: rgba(255,255,255,0.28); --line-strong: rgba(255,255,255,0.45); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="app-header" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <img class="brand-mark" src="skilly-cursor.png" alt="" aria-hidden="true" />
          <div class="brand-copy" data-tauri-drag-region>
            <div class="brand-title">Skilly</div>
            <div class="brand-subtitle" id="accountSummary">Connecting</div>
          </div>
        </div>
        <div class="header-spacer" data-tauri-drag-region></div>
        <nav class="header-actions" aria-label="Skilly tools">
          <button class="icon-button" type="button" data-view="history" aria-label="Conversation history" aria-pressed="false" title="History">↺</button>
          <button class="icon-button" type="button" data-view="settings" aria-label="Settings" aria-pressed="false" title="Settings">⚙</button>
          <button class="icon-button" type="button" data-command="hide_main_window" aria-label="Close Skilly" title="Close">×</button>
        </nav>
      </header>

      <main class="content">
        <section class="view home-view" id="view-home" role="region" aria-label="Skilly home"></section>
        <section class="view secondary-view" id="view-history" role="region" aria-label="Conversation history" hidden></section>
        <section class="view secondary-view" id="view-settings" role="region" aria-label="Settings" hidden></section>
      </main>

      <div class="ptt-strip" id="pttStrip" aria-live="polite">
        <span>Hold</span>
        <span class="key" id="firstKey">Ctrl</span>
        <span class="key" id="secondKey">Alt</span>
        <span id="pttHint">to talk</span>
        <span class="status" id="turnStatus" data-tone="idle">Idle</span>
      </div>

      <footer class="app-footer">
        <span class="footer-status" id="footerStatus">Starting Skilly</span>
        <div class="footer-actions">
          <button class="text-button" type="button" data-command="refresh_platform_facts">Refresh</button>
          <button class="text-button" type="button" data-command="quit_app">Quit</button>
        </div>
      </footer>
    </div>
    <div class="sr-only" id="announcer" aria-live="polite"></div>

    <script type="module">
      const elements = {
        accountSummary: document.getElementById("accountSummary"),
        home: document.getElementById("view-home"),
        history: document.getElementById("view-history"),
        settings: document.getElementById("view-settings"),
        firstKey: document.getElementById("firstKey"),
        secondKey: document.getElementById("secondKey"),
        pttHint: document.getElementById("pttHint"),
        turnStatus: document.getElementById("turnStatus"),
        footerStatus: document.getElementById("footerStatus"),
        announcer: document.getElementById("announcer")
      };

      const viewButtons = Array.from(document.querySelectorAll("[data-view]"));
      const viewMap = { home: elements.home, history: elements.history, settings: elements.settings };
      const state = {
        currentView: "home",
        appState: null,
        serializedAppState: "",
        loading: true,
        inFlight: false,
        error: null,
        importSourcePath: "",
        importMessage: "",
        reducedMotionLocal: null
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function sentenceCase(value) {
        const text = String(value ?? "idle").replaceAll("_", " ");
        return text.charAt(0).toUpperCase() + text.slice(1);
      }

      function splitShortcut(label) {
        const keys = String(label || "Ctrl + Alt").split("+").map((key) => key.trim());
        return [keys[0] || "Ctrl", keys[1] || "Alt"];
      }

      async function safeInvoke(command, args = {}) {
        if (!window.__TAURI__?.core?.invoke) throw new Error("Tauri host bridge is unavailable");
        try {
          return await window.__TAURI__.core.invoke(command, args);
        } catch (error) {
          throw new Error(error?.message || String(error));
        }
      }

      function setCurrentView(view, { track = true } = {}) {
        const next = viewMap[view] ? view : "home";
        state.currentView = next;
        Object.entries(viewMap).forEach(([name, element]) => { element.hidden = name !== next; });
        viewButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.view === next)));
        if (track) safeInvoke("track_panel_view", { view: next }).catch(() => {});
        document.querySelector(".content")?.scrollTo({ top: 0, behavior: "instant" });
      }

      function secondaryHeader(title, subtitle) {
        return `
          <header class="view-header">
            <button class="back-button" type="button" data-view="home" aria-label="Back to Skilly">‹</button>
            <div class="copy"><h1>${escapeHtml(title)}</h1><p>${escapeHtml(subtitle)}</p></div>
          </header>`;
      }

      function renderNotices(appState) {
        return (appState.notices || []).map((notice) => `
          <div class="notice" data-tone="${escapeHtml(notice.tone)}">
            <div class="copy"><h3>${escapeHtml(notice.title)}</h3><p>${escapeHtml(notice.detail)}</p></div>
          </div>`).join("");
      }

      function renderHome(appState) {
        if (!appState) {
          elements.home.innerHTML = `<div class="empty-state"><div><div class="empty-icon">…</div><h2>Starting Skilly</h2><p>${escapeHtml(state.error || "Connecting to the Windows companion.")}</p></div></div>`;
          return;
        }

        const activeSkill = appState.skills.items?.find((skill) => skill.status === "active");
        const otherSkills = (appState.skills.items || []).filter((skill) => skill.id !== activeSkill?.id);
        const needsSetup = appState.readiness.overall_status !== "ready" || appState.account.status !== "signed_in";
        const liveTurn = appState.live_turn;
        const hasConversation = liveTurn.transcript_preview && !liveTurn.transcript_preview.startsWith("Your transcript");

        const setupHeadline = appState.account.status === "signed_in"
          ? appState.onboarding.headline
          : "Sign in to get started";
        const setupDetail = appState.account.status === "signed_in"
          ? appState.onboarding.detail
          : "Keep your skills, progress, and plan connected across Skilly.";
        const setupTone = appState.account.status === "signed_in"
          ? appState.readiness.overall_status
          : "attention";
        const setupLabel = appState.account.status === "signed_in"
          ? sentenceCase(appState.readiness.overall_status)
          : "Sign in";

        const setupMarkup = needsSetup ? `
          <div class="setup-banner">
            <div class="row-start">
              <div class="copy"><h2>${escapeHtml(setupHeadline)}</h2><p>${escapeHtml(setupDetail)}</p></div>
              <span class="status" data-tone="${escapeHtml(setupTone)}">${escapeHtml(setupLabel)}</span>
            </div>
            <div class="button-row">
              <button class="button primary" type="button" data-command="${escapeHtml(appState.account.status === "signed_in" ? appState.onboarding.primary_action_command : appState.account.primary_action_command)}">${escapeHtml(appState.account.status === "signed_in" ? appState.onboarding.primary_action_label : appState.account.primary_action_label)}</button>
            </div>
          </div>` : "";

        const activeMarkup = activeSkill ? `
          <div class="active-skill">
            <div class="row-start">
              <div>
                <div class="active-label">Active now</div>
                <h2 class="skill-name">${escapeHtml(activeSkill.name)}</h2>
                <p class="skill-summary">${escapeHtml(activeSkill.summary)}</p>
              </div>
              <span class="status" data-tone="ready">Ready</span>
            </div>
          </div>` : `
          <div class="active-skill">
            <div class="copy"><h2>Choose a skill</h2><p>Activate a skill so Skilly can teach with the right course context.</p></div>
          </div>`;

        const conversationMarkup = hasConversation ? `
          <div class="conversation-preview">
            <div class="message"><strong>You</strong><p>${escapeHtml(liveTurn.transcript_preview)}</p></div>
            <div class="message assistant"><strong>Skilly</strong><p>${escapeHtml(liveTurn.response_preview)}</p></div>
          </div>` : "";

        const skillRows = otherSkills.map((skill) => `
          <div class="skill-row">
            <div class="skill-icon" aria-hidden="true">${escapeHtml(skill.name.slice(0, 1).toUpperCase())}</div>
            <div class="skill-row-copy"><strong>${escapeHtml(skill.name)}</strong><span>${escapeHtml(skill.summary)}</span></div>
            <button class="button" type="button" data-command="activate_skill" data-skill-id="${escapeHtml(skill.id)}">Activate</button>
          </div>`).join("");

        elements.home.innerHTML = `
          <div class="stack">
            ${renderNotices(appState)}
            ${setupMarkup}
            <section class="section">${activeMarkup}</section>
            <section class="section">
              <div class="turn-card">
                <div class="row-start">
                  <div class="turn-state">
                    <div class="turn-orb" aria-hidden="true">◖</div>
                    <div class="copy"><h2>${escapeHtml(liveTurn.headline)}</h2><p>${escapeHtml(liveTurn.detail)}</p></div>
                  </div>
                  <span class="status" data-tone="${escapeHtml(liveTurn.phase)}">${escapeHtml(sentenceCase(liveTurn.phase))}</span>
                </div>
                ${conversationMarkup}
              </div>
            </section>
            <section class="section">
              <div class="section-heading"><h2>Installed skills</h2><span>${appState.skills.items?.length || 0}</span></div>
              <div class="skill-list">${skillRows || `<div class="copy"><p>${escapeHtml(appState.skills.empty_detail)}</p></div>`}</div>
              <details>
                <summary>Import a skill</summary>
                <div class="import-form">
                  <input class="field" id="importSourcePath" type="text" aria-label="Skill folder or SKILL.md path" placeholder="Path to a skill folder or SKILL.md" value="${escapeHtml(state.importSourcePath)}" />
                  <div class="row"><span class="footer-status">${escapeHtml(state.importMessage)}</span><button class="button" type="button" data-command="import_skill">Import</button></div>
                </div>
              </details>
            </section>
          </div>`;

        document.getElementById("importSourcePath")?.addEventListener("input", (event) => { state.importSourcePath = event.target.value; });
      }

      function renderHistory(appState) {
        const items = appState?.history?.items || [];
        const content = items.length ? `
          <div class="history-list">
            ${items.map((item) => `
              <article class="history-card">
                <div class="history-meta"><strong>${escapeHtml(item.skill_name)}</strong><span>${escapeHtml(item.started_at_label)}</span></div>
                <div class="message"><strong>You</strong><p>${escapeHtml(item.user_text)}</p></div>
                <div class="message assistant"><strong>Skilly</strong><p>${escapeHtml(item.assistant_text)}</p></div>
              </article>`).join("")}
          </div>` : `
          <div class="empty-state"><div><div class="empty-icon">↺</div><h2>Your conversations will appear here</h2><p>Complete a voice turn and Skilly will keep the text locally on this PC.</p></div></div>`;

        elements.history.innerHTML = `
          ${secondaryHeader("Conversation history", "Stored only on this PC")}
          ${items.length ? `<div class="row" style="margin-bottom:10px"><span class="footer-status">${items.length} saved ${items.length === 1 ? "turn" : "turns"}</span><button class="text-button" type="button" data-command="clear_history">Clear history</button></div>` : ""}
          ${content}`;
      }

      function renderSettings(appState) {
        if (!appState) {
          elements.settings.innerHTML = `${secondaryHeader("Settings", "Windows companion")}<div class="empty-state"><div><h2>Settings unavailable</h2><p>${escapeHtml(state.error || "Waiting for Skilly to finish starting.")}</p></div></div>`;
          return;
        }

        const reducedMotion = state.reducedMotionLocal ?? Boolean(appState.settings.accessibility.reduced_motion);
        const signedIn = appState.account.status === "signed_in";
        elements.settings.innerHTML = `
          ${secondaryHeader("Settings", "Windows companion")}
          <div class="settings-list">
            <section class="settings-group">
              <div class="settings-title">Account</div>
              <div class="setting-row"><div class="setting-copy"><strong>${escapeHtml(appState.account.display_name)}</strong><span>${escapeHtml(appState.account.email || appState.account.plan_label)}</span></div><button class="button ${signedIn ? "" : "primary"}" type="button" data-command="${escapeHtml(appState.account.primary_action_command)}">${escapeHtml(appState.account.primary_action_label)}</button></div>
              <div class="setting-row"><div class="setting-copy"><strong>${escapeHtml(appState.account.plan_label)}</strong><span>${escapeHtml(appState.account.usage_label)}</span></div>${signedIn ? '<button class="button" type="button" data-command="refresh_account">Refresh</button>' : ""}</div>
              ${signedIn ? '<div class="setting-row"><div class="setting-copy"><strong>Subscription</strong><span>Manage billing or change your plan.</span></div><button class="button" type="button" data-command="open_customer_portal">Manage</button></div>' : ""}
            </section>

            <section class="settings-group">
              <div class="settings-title">Voice and shortcut</div>
              <div class="setting-row"><div class="setting-copy"><strong>Push to talk</strong><span>Hold the selected keys while speaking.</span></div><select class="field" id="shortcutSelect" aria-label="Push-to-talk shortcut"><option value="control_alt" ${appState.settings.push_to_talk.shortcut_label === "Ctrl + Alt" ? "selected" : ""}>Ctrl + Alt</option><option value="control_shift" ${appState.settings.push_to_talk.shortcut_label === "Ctrl + Shift" ? "selected" : ""}>Ctrl + Shift</option><option value="alt_shift" ${appState.settings.push_to_talk.shortcut_label === "Alt + Shift" ? "selected" : ""}>Alt + Shift</option></select></div>
              <div class="setting-row"><div class="setting-copy"><strong>Microphone and speakers</strong><span>${escapeHtml(appState.settings.audio.input_device_label)} / ${escapeHtml(appState.settings.audio.output_device_label)}</span></div><button class="button" type="button" data-command="open_audio_settings">Open</button></div>
            </section>

            <section class="settings-group">
              <div class="settings-title">Permissions and accessibility</div>
              <div class="setting-row"><div class="setting-copy"><strong>Microphone permission</strong><span>Review Windows privacy access for Skilly.</span></div><button class="button" type="button" data-command="open_permissions_settings">Review</button></div>
              <div class="setting-row"><div class="setting-copy"><strong>Reduced motion</strong><span>Limit interface transitions.</span></div><button class="toggle" id="reducedMotionToggle" type="button" data-on="${reducedMotion}" aria-pressed="${reducedMotion}" aria-label="Toggle reduced motion"></button></div>
            </section>

            <section class="settings-group">
              <div class="settings-title">App</div>
              <div class="setting-row"><div class="setting-copy"><strong>Updates</strong><span>Check for the latest Skilly release.</span></div><button class="button" type="button" data-command="check_for_updates">Check</button></div>
              <div class="setting-row"><div class="setting-copy"><strong>Skills folder</strong><span>${escapeHtml(appState.skills.install_path_label)}</span></div><button class="button" type="button" data-command="open_skills_folder">Open</button></div>
              ${signedIn ? '<div class="setting-row"><div class="setting-copy"><strong>Sign out</strong><span>Remove this account from Skilly on this PC.</span></div><button class="button danger" type="button" data-command="sign_out">Sign out</button></div>' : ""}
            </section>
          </div>`;

        document.getElementById("reducedMotionToggle")?.addEventListener("click", async () => {
          const next = !reducedMotion;
          state.reducedMotionLocal = next;
          renderSettings(state.appState);
          await runCommand("set_reduced_motion_preference", { reducedMotion: next });
        });
        document.getElementById("shortcutSelect")?.addEventListener("change", async (event) => {
          await runCommand("set_shortcut_preference", { shortcut: event.target.value });
        });
      }

      function updateChrome() {
        const appState = state.appState;
        if (!appState) {
          elements.accountSummary.textContent = state.error || "Connecting";
          elements.footerStatus.textContent = state.error || "Starting Skilly";
          return;
        }
        elements.accountSummary.textContent = appState.account.email || appState.account.plan_label;
        const [first, second] = splitShortcut(appState.live_turn.shortcut_label);
        elements.firstKey.textContent = first;
        elements.secondKey.textContent = second;
        elements.pttHint.textContent = appState.live_turn.phase === "listening" ? "release to ask" : "to talk";
        elements.turnStatus.dataset.tone = appState.live_turn.phase;
        elements.turnStatus.textContent = sentenceCase(appState.live_turn.phase);
        elements.footerStatus.textContent = state.error || (appState.readiness.overall_status === "ready" ? "Ready" : "Setup needs attention");
      }

      function render() {
        renderHome(state.appState);
        renderHistory(state.appState);
        renderSettings(state.appState);
        updateChrome();
        setCurrentView(state.currentView, { track: false });
      }

      async function refreshState({ force = false } = {}) {
        if (state.inFlight) return;
        state.inFlight = true;
        try {
          const appState = await safeInvoke("get_app_state");
          const serialized = JSON.stringify(appState);
          state.appState = appState;
          state.loading = false;
          state.error = null;
          if (force || serialized !== state.serializedAppState) {
            state.serializedAppState = serialized;
            render();
          } else {
            updateChrome();
          }
        } catch (error) {
          state.loading = false;
          state.error = error.message;
          render();
        } finally {
          state.inFlight = false;
        }
      }

      async function runCommand(command, explicitArgs = {}) {
        try {
          let result;
          if (command === "clear_history" && !window.confirm("Clear all saved conversation history?")) return;
          if (command === "import_skill") {
            const sourcePath = state.importSourcePath.trim();
            if (!sourcePath) { state.importMessage = "Enter a skill path first."; renderHome(state.appState); return; }
            result = await safeInvoke(command, { sourcePath });
            state.importMessage = result.message || "Skill imported";
            state.importSourcePath = "";
          } else if (command === "activate_skill") {
            result = await safeInvoke(command, { skillId: explicitArgs.skillId });
          } else if (command === "set_shortcut_preference") {
            result = await safeInvoke(command, { args: { shortcut: explicitArgs.shortcut } });
          } else if (command === "set_reduced_motion_preference") {
            result = await safeInvoke(command, { args: { reducedMotion: explicitArgs.reducedMotion } });
          } else {
            result = await safeInvoke(command);
          }
          state.error = null;
          elements.announcer.textContent = result?.message || "Done";
          await refreshState({ force: true });
        } catch (error) {
          state.error = error.message;
          elements.announcer.textContent = error.message;
          updateChrome();
        }
      }

      document.addEventListener("click", async (event) => {
        const viewTarget = event.target.closest("[data-view]");
        if (viewTarget) { setCurrentView(viewTarget.dataset.view); return; }
        const commandTarget = event.target.closest("[data-command]");
        if (commandTarget) await runCommand(commandTarget.dataset.command, commandTarget.dataset);
      });

      render();
      refreshState({ force: true });
      setInterval(() => refreshState(), 1000);
    </script>
  </body>
</html>
